name: Auto-Generate Blog Post

on:
  schedule:
    - cron: "0 8 * * 1"  # Monday    08:00 UTC
    - cron: "0 8 * * 3"  # Wednesday 08:00 UTC
    - cron: "0 8 * * 5"  # Friday    08:00 UTC
  workflow_dispatch:      # Manual trigger from GitHub UI

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Full history so we can push cleanly

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate SEO-optimised blog post via Claude
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/generate-post.mjs

      - name: Commit and push new post
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lib/data.ts
          # Only commit if data.ts actually changed (guards against duplicate generation)
          git diff --staged --quiet && echo "No changes to commit." && exit 0
          git commit -m "chore: auto-generate blog post [skip ci]"
          git push
